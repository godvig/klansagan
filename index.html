<!DOCTYPE html>
<html lang="sv" data-theme="wood">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klansagan</title>
<meta name="description" content="Klansagan – build your family history together: family tree, fan chart, sources, timeline, map and life stories. Runs in the browser, no account needed.">
<meta name="theme-color" content="#4a3324">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="stylesheet" href="src/styles.css?v=14">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="src/core.js?v=14"></script>
<script src="src/config.js?v=14"></script>
</head>
<body>
<header>
  <a class="brand" href="#trad" id="home" title="Till startsidan">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke-width="2.6" aria-hidden="true"><circle cx="10" cy="10.5" r="6.2" stroke="#f1e2c4"/><circle cx="18" cy="10.5" r="6.2" stroke="#d3ad73"/><circle cx="14" cy="17.5" r="6.2" stroke="#b78655"/><path d="M15.6 4.9a6.2 6.2 0 0 1 -1.6 11.2" stroke="#d3ad73"/></svg>
    <span>Klansagan</span>
  </a>
  <nav id="nav">
    <a href="#start" data-v="start">Start</a>
    <a href="#trad" data-v="trad">Träd</a>
    <a href="#solfjader" data-v="solfjader">Solfjäder</a>
    <a href="#personer" data-v="personer">Personer</a>
    <a href="#import" data-v="import">Läs in &amp; spara</a>
    <button class="morebtn" id="moreBtn" aria-haspopup="true"><span>Mer </span>▾</button>
    <div class="morepop" id="morePop">
      <a href="#slaktskap" data-v="slaktskap"><b>Släktskap</b><small>Hur är två personer släkt?</small></a>
      <a href="#tidslinje" data-v="tidslinje"><b>Tidslinje</b><small>Händelser i tidsordning</small></a>
      <a href="#karta" data-v="karta"><b>Karta</b><small>Var släkten har bott</small></a>
      <a href="#kallor" data-v="kallor"><b>Källor</b><small>Kyrkböcker och dokument</small></a>
    </div>
  </nav>
  <div class="hdr-right">
    <div class="viewsel"><button class="viewbtn" id="viewBtn" title="Välj vad som ska synas"></button><div class="pop" id="viewPop"></div></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" placeholder="Sök person…" autocomplete="off">
      <div class="res" id="qres"></div>
    </div>
    <button class="btn sm sharebtn" id="shareBtn" hidden>👥 Dela</button>
    <button class="status" id="status"><i></i><span>Ansluter…</span></button>
    <button class="simplepill" id="simpleExit" title="Visa alla funktioner">Enkelt läge · <u>visa allt</u></button>
    <button class="setbtn" id="settingsBtn" title="Inställningar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Inställningar</span></button>
  </div>
</header>
<div id="demoBar"><span>👑 Du tittar på exemplet <b>Vasaätten</b>. Inget sparas här – dina egna uppgifter ligger orörda.</span><span style="flex:1"></span><button class="btn primary" id="demoExitBtn" onclick="exitDemo()">Stäng exemplet</button></div>
<main>
  <section id="view"></section>
  <aside id="panel"></aside>
</main>

<script src="src/app.js?v=14"></script>
</body>
</html>
