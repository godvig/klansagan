<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Släktarkivet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root{
  --paper:#f5f0e6; --paper2:#ede6d8; --card:#fffdf8; --ink:#2a2520; --ink2:#5d554b; --ink3:#8b8174;
  --line:#d9cfbd; --line2:#c6b9a2;
  --accent:#2f5d50; --accent2:#e3ece6; --warn:#a06a1c; --err:#9b3a2e;
  --male:#56769a; --female:#a65d6b; --unk:#8b8174;
  --serif:'Fraunces',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(60,45,20,.06),0 4px 16px rgba(60,45,20,.07);
  --input:#fff; --hover:#faf6ee; --glass:rgba(255,253,248,.93); --sea:#dfe7ea; --land:#f3eee3; --land2:#fbf8f1; --landline:#c9bfae;
  --grid:#ece4d4; --warnbg:#f6e7cf; --warnfg:#7a5115; --dot:rgba(120,100,70,.13); --accentH:#264d42; --dangerline:#dcb9b2; --citebg:#fdfbf6;
  color-scheme:light;
}
[data-theme=dark]{
  --paper:#1b1916; --paper2:#26231f; --card:#221f1b; --ink:#ece6da; --ink2:#c0b7a8; --ink3:#8f8677;
  --line:#37322b; --line2:#4a443b; --accent:#7db4a1; --accent2:#24342e; --warn:#d9a14a; --err:#e07a6a;
  --male:#86a6cc; --female:#d48f9c; --unk:#9a9182;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  --input:#171512; --hover:#2a2622; --glass:rgba(34,31,27,.93); --sea:#151c20; --land:#2b2722; --land2:#35302a; --landline:#4d463c;
  --grid:#2c2823; --warnbg:#3b2f1c; --warnfg:#e8bd73; --dot:rgba(255,240,210,.07); --accentH:#94c7b5; --dangerline:#6a3a33; --citebg:#26231f;
  color-scheme:dark;
}
[data-theme=dark] .btn.primary{color:#10201b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
a{color:var(--accent)}
.muted{color:var(--ink3)}
.small{font-size:12px}

/* Header */
header{display:flex;align-items:center;gap:18px;padding:0 18px;height:56px;border-bottom:1px solid var(--line);background:var(--paper);flex:none}
.brand{color:inherit;text-decoration:none;cursor:pointer;display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap}
.brand svg{flex:none}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:500;white-space:nowrap}
nav a:hover{background:var(--paper2)}
nav a.on{background:var(--ink);color:var(--paper)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{position:relative}
.search input{width:220px;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.search svg{position:absolute;left:9px;top:9px;color:var(--ink3)}
.search .res{position:absolute;top:38px;right:0;width:300px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:50;max-height:360px;overflow:auto;display:none}
.search .res.open{display:block}
.res .item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--paper2)}
.res .item:hover,.res .item.hl{background:var(--accent2)}
.status{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.status.ok i{background:#4b8b62}.status.warn i{background:var(--warn)}.status.err i{background:var(--err)}

/* Layout */
main{flex:1;display:flex;min-height:0;position:relative}
#view{flex:1;min-width:0;position:relative;overflow:auto}
#panel{width:400px;flex:none;border-left:1px solid var(--line);background:var(--card);overflow:auto;display:none}
#panel.open{display:block}
.view-pad{padding:24px 28px;max-width:1200px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{font-size:24px;margin-right:auto}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}
.btn:hover{background:var(--paper2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accentH)}
.btn.danger{color:var(--err);border-color:var(--dangerline)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--paper2)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:none;background:none;cursor:pointer;padding:4px;border-radius:6px;color:var(--ink3);line-height:0}
.iconbtn:hover{background:var(--paper2);color:var(--ink)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
input.t,select.t,textarea.t{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--input)}
input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
textarea.t{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--ink3);margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:12.5px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:none;padding:6px 10px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--ink);color:var(--paper)}
.ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.ctl select{padding:5px 6px;border:1px solid var(--line2);border-radius:7px;background:var(--card)}

/* Tables */
table.list{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:600;padding:9px 12px;background:var(--paper2);border-bottom:1px solid var(--line)}
.list td{padding:9px 12px;border-bottom:1px solid var(--paper2);vertical-align:top}
.list tr.click{cursor:pointer}
.list tr.click:hover td{background:var(--hover)}
.list tr.sel td{background:var(--accent2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--paper2);color:var(--ink2);margin:1px 3px 1px 0}
.tag.warn{background:var(--warnbg);color:var(--warnfg)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:24px;font-weight:600}
.stat span{font-size:12px;color:var(--ink3)}

/* Tree */
#treeWrap{position:absolute;inset:0;background:
  radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0) 0 0/22px 22px,var(--paper)}
#treeSvg{width:100%;height:100%;display:block;cursor:grab}
#treeSvg:active{cursor:grabbing}
.tree-tools{position:absolute;top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:7px 10px;box-shadow:var(--shadow);z-index:5}
.tree-tools .fname{font-family:var(--serif);font-weight:600;font-size:15px;margin-right:4px}
.card rect.bg{fill:var(--card);stroke:var(--line2);stroke-width:1}
.card:hover rect.bg{stroke:var(--ink2)}
.card.focus rect.bg{stroke:var(--accent);stroke-width:2.5}
.card.sel rect.bg{fill:var(--accent2)}
.card text{font-family:var(--sans);fill:var(--ink)}
.card .nm{font-weight:600;font-size:13px}
.card .yr{font-size:11.5px;fill:var(--ink2)}
.card .pl{font-size:11px;fill:var(--ink3)}
.card{cursor:pointer}
.ghost rect{fill:var(--glass);fill-opacity:.6;stroke:var(--line2);stroke-dasharray:4 4}
.ghost text{font-size:12px;fill:var(--ink3);font-family:var(--sans)}
.ghost:hover rect{stroke:var(--accent);fill:var(--card)}
.ghost:hover text{fill:var(--accent)}
.ghost{cursor:pointer}
.link{fill:none;stroke:var(--line2);stroke-width:1.6}
.link.sp{stroke:var(--accent);stroke-dasharray:2 3}
.gen-label{font-family:var(--serif);font-size:12px;fill:var(--ink3);font-style:italic}

/* Empty */
.empty{max-width:520px;margin:9vh auto;text-align:center;padding:0 20px}
.empty h2{font-size:30px;margin:14px 0 10px}
.empty p{color:var(--ink2);line-height:1.6}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* Panel */
.ph{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:3}
.ph .top{display:flex;gap:12px;align-items:flex-start}
.avatar.clickable{cursor:pointer}.avatar.clickable:hover{border-color:var(--accent)!important;opacity:.9}
.avatar{width:54px;height:54px;border-radius:50%;flex:none;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;color:var(--ink2);overflow:hidden;border:2px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.ph h3{font-size:21px;line-height:1.2}
.ph .sub{color:var(--ink2);margin-top:3px}
.ph .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.sec{padding:14px 20px;border-bottom:1px solid var(--paper2)}
.sec h4{margin:0 0 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);display:flex;align-items:center;gap:6px}
.sec h4 .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.facts{display:grid;grid-template-columns:70px 1fr;gap:5px 10px}
.facts dt{color:var(--ink3);font-size:12.5px}
.facts dd{margin:0}
.rel{display:flex;align-items:center;gap:8px;padding:5px 0}
.rel .who{flex:1;cursor:pointer}
.rel .who:hover b{text-decoration:underline}
.rel .lbl{width:56px;font-size:12px;color:var(--ink3);flex:none}
.ev{display:grid;grid-template-columns:86px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px dashed var(--paper2);align-items:start}
.ev:last-child{border-bottom:none}
.ev .d{white-space:nowrap;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ev .w b{font-weight:600}
.cite{padding:8px 10px;border:1px solid var(--paper2);border-radius:8px;margin-bottom:6px;background:var(--citebg)}
.cite b{cursor:pointer}
.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.media .m{aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--paper2);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:4px;color:var(--ink2)}
.media .m img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
.mini .row2{gap:8px}
.mini label.f{margin-bottom:8px}

/* Timeline */
#tlChart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;position:relative}
#tlChart svg text{font-family:var(--sans)}
.tl-row:hover .tl-bg{fill:var(--hover)}
.tl-name{font-size:12.5px;fill:var(--ink);cursor:pointer}
.tl-name:hover{text-decoration:underline}
.axis text{font-size:11px;fill:var(--ink3)}
.axis path,.axis line{stroke:var(--line2)}
.hist-band{fill:var(--warn);opacity:.08}
.hist-lbl{font-size:10.5px;fill:var(--warnfg)}
.evlist{margin-top:18px}

/* Map */
#mapWrap{position:absolute;inset:0;background:var(--sea)}
#mapSvg{width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--landline);stroke-width:.6;vector-effect:non-scaling-stroke}
.land.home{fill:var(--land2)}
.mk{cursor:pointer}
.mk circle{fill:var(--accent);fill-opacity:.82;stroke:var(--card);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mk:hover circle,.mk.sel circle{fill:var(--err)}
.mk text{font-size:11px;font-family:var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;pointer-events:none}
.route{fill:none;stroke:var(--err);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-dasharray:6 4}
.map-side{position:absolute;top:14px;left:14px;width:270px;max-height:calc(100% - 28px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;z-index:5}
.map-side h3{font-size:17px;margin-bottom:8px}
.pl-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px;cursor:pointer}
.pl-item:hover{background:var(--paper2)}
.pl-item .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:8;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.map-zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.map-zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:18px}

/* Import */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.box h3{font-size:18px;margin-bottom:6px}
.box p{color:var(--ink2);margin:0 0 12px;line-height:1.55}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink2);cursor:pointer;background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--accent2)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 16px}
.mapgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--ink2)}
.mapgrid select{padding:6px;border:1px solid var(--line2);border-radius:7px;background:var(--input);font-weight:400}
.prev{overflow:auto;max-height:300px;margin-top:12px}
.prev table{font-size:12.5px}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(42,37,32,.38);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px;overflow:auto}
.modal{background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:560px;max-width:100%;padding:22px 24px}
.modal h3{font-size:21px;margin-bottom:16px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.lightbox{position:fixed;inset:0;background:rgba(20,17,14,.88);z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;color:#fff}
.lightbox img{max-width:100%;max-height:78vh;border-radius:6px}
.lightbox .cap{margin-top:12px;display:flex;gap:10px;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;z-index:200;box-shadow:var(--shadow);font-size:13.5px}
.progress{height:6px;background:var(--paper2);border-radius:4px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);width:0}

/* Theme toggle, demo banner */
.themebtn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);flex:none}
.themebtn:hover{color:var(--ink);background:var(--paper2)}
#demoBar{display:none;align-items:center;gap:12px;padding:8px 18px;background:var(--warnbg);color:var(--warnfg);border-bottom:1px solid var(--line);font-size:13.5px;flex:none;flex-wrap:wrap}
#demoBar.on{display:flex}
#demoBar .btn{padding:4px 11px;font-size:12.5px}

/* Start page */
.start{max-width:1040px;margin:0 auto;padding:44px 28px 60px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;align-items:center;margin-bottom:34px}
.hero h1{font-size:44px;line-height:1.08;margin-bottom:14px}
.hero p{color:var(--ink2);font-size:16px;line-height:1.6;margin:0 0 20px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{padding:10px 16px;font-size:14.5px}
.hero-art{aspect-ratio:1.25;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;text-decoration:none;color:inherit;display:block;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
.tile .ic{font-size:22px;margin-bottom:8px;display:block}
.tile b{font-family:var(--serif);font-size:17px;font-weight:600;display:block;margin-bottom:3px}
.tile span{color:var(--ink3);font-size:13px;line-height:1.45}
.start h2.sec-t{font-size:20px;margin:34px 0 12px}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pchip{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.pchip:hover{border-color:var(--line2);background:var(--hover)}
.pchip .avatar{width:36px;height:36px;font-size:14px;border-width:2px}
.pchip .t{min-width:0}.pchip .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pchip .t span{font-size:12px;color:var(--ink3)}

/* Fan chart */
#fanWrap{position:absolute;inset:0;background:var(--paper)}
#fanSvg{width:100%;height:100%;display:block;cursor:grab}
.fan-seg{stroke:var(--card);stroke-width:1.5;cursor:pointer}
.fan-seg:hover{filter:brightness(1.08)}
.fan-empty{fill:transparent;stroke:var(--line2);stroke-dasharray:3 3;cursor:pointer}
.fan-empty:hover{fill:var(--accent2)}
.fan-txt{font-family:var(--sans);fill:var(--ink);pointer-events:none}
.fan-legend{position:absolute;right:14px;top:14px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;box-shadow:var(--shadow);z-index:5;min-width:190px}
.fan-legend .row{display:flex;align-items:center;gap:8px;margin:3px 0}
.fan-legend .bar{flex:1;height:5px;border-radius:3px;background:var(--paper2);overflow:hidden}
.fan-legend .bar i{display:block;height:100%;background:var(--accent)}

/* Person card page */
.pc{max-width:980px;margin:0 auto;padding:28px 28px 60px}
.pc-head{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.pc-photo{width:150px;height:150px;border-radius:50%;overflow:hidden;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:48px;color:var(--ink3);border:4px solid var(--card);box-shadow:0 0 0 2px var(--line2),var(--shadow)}
.pc-photo img{width:100%;height:100%;object-fit:cover}
.pc-head h1{font-size:38px;line-height:1.1}
.pc-head .life{font-size:17px;color:var(--ink2);margin-top:6px}
.pc-head .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pc-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:26px}
.pc h3{font-size:19px;margin:0 0 12px}
.story{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink);margin:0 0 26px}
.vtl{position:relative;padding-left:22px;margin-bottom:26px}
.vtl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.vtl .it{position:relative;padding:0 0 14px}
.vtl .it:before{content:'';position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.vtl .it .d{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.fam-group{margin-bottom:16px}
.fam-group h5{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:26px}
.gallery .m{aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--paper2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.gallery .m img{width:100%;height:100%;object-fit:cover}

/* Duplicates & relationship */
.dup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.dup-grid{display:grid;grid-template-columns:110px 1fr 1fr;gap:4px 14px;font-size:13px;margin:10px 0}
.dup-grid .h{font-weight:600}
.dup-grid .k{color:var(--ink3)}
.dup-grid .diff{color:var(--warnfg);background:var(--warnbg);border-radius:4px;padding:0 4px}
.score{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent2);color:var(--accent)}
.rel-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-bottom:22px}
.rel-answer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.rel-answer .big{font-family:var(--serif);font-size:28px;line-height:1.25}
.rel-path{display:flex;gap:30px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:18px}
.rel-col{display:flex;flex-direction:column;align-items:center;gap:0}
.rel-col .pchip{min-width:220px}
.rel-col .arrow{width:2px;height:18px;background:var(--line2)}
.rel-top{display:flex;gap:8px;justify-content:center;margin-bottom:0}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}.hero-art{display:none}.hero h1{font-size:32px}
  .pc-grid{grid-template-columns:1fr}.pc-head{grid-template-columns:1fr;text-align:center;justify-items:center}.pc-photo{width:110px;height:110px}
  .rel-pick{grid-template-columns:1fr}
  .dup-grid{grid-template-columns:80px 1fr 1fr}
  header{gap:10px;padding:0 10px}
  .brand span{display:none}
  .search input{width:130px}
  .status span{display:none}
  #panel{position:absolute;inset:0;width:auto;z-index:30;border-left:none}
  .view-pad{padding:16px}
  .map-side{width:auto;right:14px;max-height:40%}
  .row2{grid-template-columns:1fr}
}

<script>
"use strict";
/* ============ Helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const norm=s=>String(s??'').toLowerCase().normalize('NFC').replace(/\s+/g,' ').trim();
const clone=o=>JSON.parse(JSON.stringify(o));
const yearOf=s=>{const m=String(s??'').match(/(\d{4})/);return m?+m[1]:null};
function dateKey(s){
  if(!s) return null;
  const m=String(s).match(/(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?/);
  if(!m) return null;
  return +m[1]+((+(m[2]||6))-1)/12+((+(m[3]||15))-1)/372;
}
const NOW_Y=new Date().getFullYear();
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

const EVENT_TYPES=['Dop','Konfirmation','Vigsel','Kröning','Skilsmässa','Flytt','Bosatt','Yrke','Militärtjänst','Utvandring','Invandring','Begravning','Bouppteckning','Fotografi','Övrigt'];
const SOURCE_TYPES=['Husförhörslängd','Församlingsbok','Födelse- och dopbok','Lysnings- och vigselbok','Död- och begravningsbok','Flyttlängd','Bouppteckning','Folkräkning','Mantalslängd','Generalmönsterrulla','Emigrantregister','Passagerarlista','Domstolsprotokoll','Fotografi','Brev','Muntlig uppgift','Webbplats','Övrigt'];
const HIST=[
  {a:1520,b:1520,t:'Stockholms blodbad'},
  {a:1527,b:1527,t:'Reformationen inleds (Västerås riksdag)'},
  {a:1542,b:1543,t:'Dackefejden'},
  {a:1563,b:1570,t:'Nordiska sjuårskriget'},
  {a:1618,b:1648,t:'Trettioåriga kriget'},
  {a:1628,b:1628,t:'Regalskeppet Vasa sjunker'},
  {a:1686,b:1686,t:'Kyrkolagen – kyrkböcker krävs'},
  {a:1710,b:1711,t:'Pesten'},
  {a:1808,b:1809,t:'Finska kriget'},
  {a:1834,b:1834,t:'Koleran'},
  {a:1867,b:1869,t:'Nödåren'},
  {a:1868,b:1914,t:'Den stora emigrationen'},
  {a:1901,b:1901,t:'Allmän värnplikt'},
  {a:1918,b:1920,t:'Spanska sjukan'},
  {a:1921,b:1921,t:'Allmän rösträtt'},
  {a:1939,b:1945,t:'Andra världskriget'},
  {a:1991,b:1991,t:'Folkbokföringen till Skatteverket'},
];

/* ============ State ============ */
const S={persons:{},places:{},sources:{}};
const KIND={person:'persons',place:'places',source:'sources'};
const ui={view:'trad',focus:null,sel:null,ancGen:3,descGen:2,plFilter:'alla',plSort:'namn',plQuery:'',
  tlScope:'alla',tlHist:true,mapScope:'alla',mapRoute:true,placing:null,treeKey:null};
try{const f=localStorage.getItem('sa-focus'); if(f) ui.focus=f;}catch(e){}

/* ============ Store ============ */
const Store={
  mode:'loading',col:null,canEdit:true,assets:null,downloads:null,chains:{},loaded:false,
  async init(){
    let db=null,user=null;
    if(window.claude && typeof window.claude.use==='function'){
      const get=n=>Promise.resolve(window.claude.use(n)).catch(()=>null);
      [db,user,this.assets,this.downloads]=await Promise.all([get('db'),get('user'),get('assets'),get('downloads')]);
    }
    if(db){
      this.mode='db'; this.col=db.collection('tree');
      if(user){try{const c=await user.canEdit(); if(c===false) this.canEdit=false;}catch(e){}}
      this.subscribe();
    }else{
      this.mode='local'; this.loadLocal(); this.loaded=true;
      setStatus('warn','Sparas bara i den här webbläsaren');
      renderAll();
    }
  },
  subscribe(){
    setStatus('', 'Hämtar…');
    let timer=setTimeout(()=>setStatus('warn','Databasen svarar inte ännu'),10000);
    this.col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer); setStatus('ok','Sparat i molnet');}
      S.persons={};S.places={};S.sources={};
      for(const d of snap.docs){const o=d.data(); if(o&&KIND[o.kind]) S[KIND[o.kind]][d.id]=o;}
      this.loaded=true; renderAll();
    },err=>{clearTimeout(timer); setStatus('err','Kunde inte läsa data ('+err.code+')'); this.loaded=true; renderAll();});
  },
  loadLocal(){
    try{const raw=localStorage.getItem('slaktarkivet-v1'); if(raw){const o=JSON.parse(raw); Object.assign(S,{persons:o.persons||{},places:o.places||{},sources:o.sources||{}});}}catch(e){}
  },
  saveLocal(){
    clearTimeout(this._lt);
    this._lt=setTimeout(()=>{try{localStorage.setItem('slaktarkivet-v1',JSON.stringify(S));}catch(e){toast('Webbläsarens lagring är full – ta bort några bilder eller exportera en säkerhetskopia.',6000);}},250);
  },
  async write(id,fn){
    const prev=this.chains[id]||Promise.resolve();
    const next=prev.catch(()=>{}).then(fn);
    this.chains[id]=next; return next;
  },
  async retry(fn){
    for(let i=0;;i++){
      try{return await fn();}catch(e){
        if(i<4&&(e&&(e.code==='unavailable'||e.code==='resource_exhausted'))){await new Promise(r=>setTimeout(r,400*(i+1)+Math.random()*300));continue;}
        throw e;
      }
    }
  },
  put(obj,{silent}={}){
    obj=clone(obj); obj.updatedAt=new Date().toISOString();
    S[KIND[obj.kind]][obj.id]=obj;
    if(!silent) renderAll();
    if(this.mode==='db'){
      return this.write(obj.id,()=>this.retry(()=>this.col.doc(obj.id).set(obj))).catch(e=>{
        if(e&&e.code==='quota_exceeded') toast('Databasen är full – ta bort något först.');
        else if(e&&e.code==='invalid_argument') toast('Du har inte behörighet att ändra (eller posten är för stor).');
        else toast('Kunde inte spara: '+(e&&e.code||e));
      });
    } else {this.saveLocal(); return Promise.resolve();}
  },
  del(kind,id,{silent}={}){
    delete S[KIND[kind]][id];
    if(!silent) renderAll();
    if(this.mode==='db') return this.write(id,()=>this.retry(()=>this.col.doc(id).delete())).catch(e=>toast('Kunde inte ta bort: '+(e&&e.code||e)));
    this.saveLocal(); return Promise.resolve();
  },
  async putMany(objs,onProgress){
    let done=0; const queue=objs.slice();
    if(this.mode!=='db'){for(const o of queue){o.updatedAt=new Date().toISOString(); S[KIND[o.kind]][o.id]=clone(o);} this.saveLocal(); onProgress&&onProgress(1); renderAll(); return;}
    for(const o of queue){o.updatedAt=new Date().toISOString(); S[KIND[o.kind]][o.id]=clone(o);}
    renderAll();
    const worker=async()=>{while(queue.length){const o=queue.shift(); await this.write(o.id,()=>this.retry(()=>this.col.doc(o.id).set(clone(o)))).catch(e=>{console.warn(e)}); done++; onProgress&&onProgress(done/objs.length);}};
    await Promise.all([worker(),worker(),worker()]);
  }
};
function setStatus(cls,txt){const s=$('#status'); s.className='status '+cls; s.querySelector('span').textContent=txt; s.title=txt;}

/* ============ Domain helpers ============ */
const P=id=>S.persons[id];
const fullName=p=>p?([p.given,p.surname].filter(Boolean).join(' ')||'Namnlös'):'Okänd';
const initials=p=>{const w=[p.given,p.surname].filter(Boolean).join(' ').split(/\s+/).filter(x=>/^[A-ZÅÄÖÉŁ]/i.test(x)&&!/^(av|von|de)$/i.test(x)); return ((w[0]||'?')[0]+(w.length>1&&!/^[IVX]+$/.test(w[1])?w[1][0]:'')).toUpperCase();};
function lifespan(p){const b=yearOf(p.birthDate),d=yearOf(p.deathDate); if(!b&&!d) return ''; return (b||'?')+' – '+(d||(b&&NOW_Y-b<105?'':'?'));}
const sexColor=p=>p&&p.sex==='M'?'var(--male)':p&&p.sex==='K'?'var(--female)':'var(--unk)';
const placeName=id=>id&&S.places[id]?S.places[id].name:'';
function children(id){return Object.values(S.persons).filter(c=>c.fatherId===id||c.motherId===id).sort((a,b)=>(dateKey(a.birthDate)||9999)-(dateKey(b.birthDate)||9999));}
function partners(p){const set=new Set(p.spouseIds||[]); for(const c of children(p.id)){const o=c.fatherId===p.id?c.motherId:c.fatherId; if(o) set.add(o);} set.delete(p.id); return [...set].map(P).filter(Boolean);}
function siblings(p){if(!p.fatherId&&!p.motherId) return []; return Object.values(S.persons).filter(s=>s.id!==p.id&&((p.fatherId&&s.fatherId===p.fatherId)||(p.motherId&&s.motherId===p.motherId))).sort((a,b)=>(dateKey(a.birthDate)||9999)-(dateKey(b.birthDate)||9999));}
const isImg=m=>/^image\//.test(m&&m.contentType||'');
function avatarUrl(p){const imgs=(p.media||[]).filter(isImg); const m=imgs.find(m=>m.profile)||imgs[0]; return m?m.url:null;}
const homePerson=()=>Object.values(S.persons).find(p=>p.home);
function goHome(){const h=homePerson(); if(h) setFocus(h.id); else {const first=Object.values(S.persons).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))[0]; if(first) setFocus(first.id);} ui.sel=null; ui.treeKey=null; ui.plQuery=''; if(location.hash!=='#trad') location.hash='trad'; else renderAll(true); window.scrollTo(0,0);}
async function setHome(id){for(const p of Object.values(S.persons)) if(p.home&&p.id!==id){const q=clone(p); delete q.home; await Store.put(q,{silent:true});} const q=clone(P(id)); q.home=true; await Store.put(q); toast('⌂ '+fullName(q)+' är nu startperson – loggan tar dig hit.');}
function ancestorsOf(id,max=50){const out=new Set();const walk=(i,d)=>{const p=P(i);if(!p||d>max)return;for(const k of ['fatherId','motherId']){if(p[k]&&!out.has(p[k])){out.add(p[k]);walk(p[k],d+1);}}};walk(id,0);return out;}
function descendantsOf(id){const out=new Set();const walk=i=>{for(const c of children(i)){if(!out.has(c.id)){out.add(c.id);walk(c.id);}}};walk(id);return out;}
function scopeSet(scope){
  const f=ui.focus&&P(ui.focus)?ui.focus:null;
  if(scope==='alla'||!f) return null;
  const s=scope==='anor'?ancestorsOf(f):descendantsOf(f); s.add(f); return s;
}
/** All dated facts for a person (birth, death, events) */
function lifeEvents(p){
  const ev=[];
  if(p.birthDate||p.birthPlace) ev.push({type:'Född',date:p.birthDate,placeId:p.birthPlace,fixed:'birth'});
  for(const e of p.events||[]) ev.push(Object.assign({},e));
  if(p.deathDate||p.deathPlace) ev.push({type:'Död',date:p.deathDate,placeId:p.deathPlace,fixed:'death'});
  return ev.sort((a,b)=>{const ka=dateKey(a.date),kb=dateKey(b.date); if(a.fixed==='birth') return -1; if(b.fixed==='birth') return 1; if(a.fixed==='death'&&kb!=null) return ka==null?1:ka-kb; return (ka??9e9)-(kb??9e9);});
}
function ensurePlace(name){
  name=String(name||'').trim(); if(!name) return {id:'',created:null};
  const n=norm(name);
  const ex=Object.values(S.places).find(pl=>norm(pl.name)===n);
  if(ex) return {id:ex.id,created:null};
  const pl={kind:'place',id:uid('pl'),name}; S.places[pl.id]=pl; return {id:pl.id,created:pl};
}
const genitive=n=>/[sxz]$/i.test(n)?n:n+'s';
function ageAt(p){const b=yearOf(p.birthDate),d=yearOf(p.deathDate); if(b&&d) return d-b; return null;}
function personLabel(p){const ls=lifespan(p); return fullName(p)+(ls?' ('+ls.replace(/\s/g,'')+')':'');}

/* ============ Router ============ */
const VIEWS={start:renderStart,trad:renderTree,solfjader:renderFan,personer:renderPersons,slaktskap:renderRel,personkort:renderCard,dubbletter:renderDups,tidslinje:renderTimeline,karta:renderMap,kallor:renderSources,import:renderImport};
const NAVMAP={personkort:'personer',dubbletter:'personer'};
function route(){const h=location.hash.slice(1); ui.view=VIEWS[h]?h:'start'; const nv=NAVMAP[ui.view]||ui.view; document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===nv)); $('#view').scrollTop=0; ui.treeKey=null; mapState.drawn=false; renderAll(true);}
window.addEventListener('hashchange',route);
let lastView=null;
function renderAll(force){
  if(!Store.loaded){ $('#view').innerHTML='<div class="empty"><p class="muted">Laddar släktarkivet…</p></div>'; return; }
  if(ui.focus&&!P(ui.focus)) ui.focus=null;
  if(!ui.focus){const h=homePerson(); if(h) ui.focus=h.id;}
  if(!ui.focus){const first=Object.values(S.persons).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))[0]; if(first) ui.focus=first.id;}
  if(ui.sel&&ui.sel.type==='person'&&!P(ui.sel.id)) ui.sel=null;
  if(ui.sel&&ui.sel.type==='place'&&!S.places[ui.sel.id]) ui.sel=null;
  if(ui.sel&&ui.sel.type==='source'&&!S.sources[ui.sel.id]) ui.sel=null;
  renderPanel(); updateDemoBar();
  VIEWS[ui.view](force||lastView!==ui.view); lastView=ui.view;
}
function setFocus(id){ui.focus=id; try{localStorage.setItem('sa-focus',id)}catch(e){} }
function select(type,id){ui.sel=id?{type,id}:null; renderAll();}
function showPerson(id,{focus}={}){if(focus) setFocus(id); select('person',id);}

/* ============ Empty state ============ */
function emptyState(){
  return `<div class="empty">
    <svg width="64" height="64" viewBox="0 0 26 26" fill="none" stroke="var(--accent)" stroke-width="1.2"><path d="M13 24V13M13 13c0-4 -3-6-6-6M13 13c0-4 3-6 6-6M13 17c-2-1-5-1-7 1M13 17c2-1 5-1 7 1"/><circle cx="7" cy="6" r="2.4"/><circle cx="19" cy="6" r="2.4"/><circle cx="13" cy="3.6" r="2"/></svg>
    <h2>Börja ditt släktarkiv</h2>
    <p>Lägg till dig själv eller den äldsta ana du känner till, eller läs in din befintliga släktlista från Excel. Du kan också titta runt i Vasaätten som exempel först – från Gustav Vasa till drottning Kristina.</p>
    <div class="acts">
      ${Store.canEdit?`<button class="btn primary" onclick="openPersonModal()">+ Lägg till första personen</button>
      <a class="btn" href="#import">Importera från Excel</a>
      <button class="btn" onclick="loadDemo()">Visa Vasaätten som exempel</button>`:'<p class="muted">Arkivet är tomt.</p>'}
    </div></div>`;
}

/* ============ TREE ============ */
const CW=196,CH=68;
let treeZoom=null;
function renderTree(fresh){
  const v=$('#view');
  if(!Object.keys(S.persons).length){v.innerHTML=emptyState();ui.treeKey=null;return;}
  const F=P(ui.focus);
  if(!$('#treeSvg')||fresh){
    v.innerHTML=`<div id="treeWrap"><svg id="treeSvg"><defs><clipPath id="avclip"><circle cx="28" cy="34" r="20"/></clipPath></defs><g class="vp"></g></svg>
      <div class="tree-tools">
        <span class="fname" id="tfName"></span>
        <span class="ctl">Anor <select id="tAnc">${[1,2,3,4,5,6].map(n=>`<option ${n===ui.ancGen?'selected':''}>${n}</option>`).join('')}</select></span>
        <span class="ctl">Ättlingar <select id="tDesc">${[0,1,2,3,4].map(n=>`<option ${n===ui.descGen?'selected':''}>${n}</option>`).join('')}</select></span>
        <button class="btn sm" id="tFit">Centrera</button>
        <button class="btn sm" id="tPrint">⎙ Skriv ut / spara</button>
        ${Store.canEdit?'<button class="btn sm primary" onclick="openPersonModal()">+ Person</button>':''}
      </div></div>`;
    $('#tAnc').onchange=e=>{ui.ancGen=+e.target.value;ui.treeKey=null;renderTree();};
    $('#tDesc').onchange=e=>{ui.descGen=+e.target.value;ui.treeKey=null;renderTree();};
    $('#tFit').onclick=()=>{ui.treeKey=null;renderTree();};
    $('#tPrint').onclick=()=>printChart($('#treeSvg'),'Släktträd för '+fullName(P(ui.focus)),'slakttrad');
    const svg=d3.select('#treeSvg');
    treeZoom=d3.zoom().scaleExtent([.15,2.5]).on('zoom',e=>svg.select('g.vp').attr('transform',e.transform));
    svg.call(treeZoom).on('dblclick.zoom',null);
    ui.treeKey=null;
  }
  $('#tfName').textContent=fullName(F);
  const svg=d3.select('#treeSvg'), g=svg.select('g.vp');
  const nodes=[],links=[];
  // ancestors
  const anc=(p,depth)=>{const n={p,children:[]}; if(depth<ui.ancGen){for(const rel of ['father','mother']){const q=P(p[rel+'Id']); if(q) n.children.push(anc(q,depth+1)); else if(Store.canEdit) n.children.push({ghost:rel,of:p.id,children:[]});}} return n;};
  const aRoot=d3.hierarchy(anc(F,0));
  d3.tree().nodeSize([CW+18,CH+56]).separation((a,b)=>a.parent===b.parent?1:1.12)(aRoot);
  aRoot.each(n=>{n.y=-n.depth*(CH+56); if(n.depth>0){nodes.push(n); links.push({type:'anc',s:n.parent,t:n});}});
  // partners of focus
  const parts=partners(F); const pPos={};
  parts.forEach((sp,i)=>{const n={data:{p:sp,partner:true},x:(i+1)*(CW+34),y:0}; nodes.push(n); pPos[sp.id]=n; links.push({type:'sp',s:i===0?{x:0,y:0}:{x:i*(CW+34),y:0},t:n});});
  // descendants
  const dRoot=d3.hierarchy((function desc(p,depth){return {p,children:depth<ui.descGen?children(p.id).map(c=>desc(c,depth+1)):[]};})(F,0));
  d3.tree().nodeSize([CW+18,CH+56])(dRoot);
  const shift=parts.length?(CW+34)/2:0;
  dRoot.each(n=>{n.y=n.depth*(CH+56); if(n.depth>0){n.x+=shift; nodes.push(n);}});
  dRoot.each(n=>{if(n.depth>0){
    let sx=n.parent.depth===0?0:n.parent.x, sy=n.parent.y;
    if(n.parent.depth===0){const other=n.data.p.fatherId===F.id?n.data.p.motherId:n.data.p.fatherId; if(other&&pPos[other]) sx=pPos[other].x/2; }
    links.push({type:'desc',s:{x:sx,y:sy,mid:n.parent.depth===0&&sx!==0},t:n});
  }});
  nodes.push({data:{p:F},x:0,y:0,focus:true});

  // links
  const lp=l=>{
    if(l.type==='sp') return `M${l.s.x+CW/2},0H${l.t.x-CW/2}`;
    if(l.type==='anc'){const y1=l.s.y-CH/2,y2=l.t.y+CH/2,my=(y1+y2)/2;return `M${l.s.x},${y1}V${my}H${l.t.x}V${y2}`;}
    const y1=l.s.mid?l.s.y:l.s.y+CH/2,y2=l.t.y-CH/2,my=l.s.y+CH/2+(y2-(l.s.y+CH/2))/2;return `M${l.s.x},${y1}V${my}H${l.t.x}V${y2}`;
  };
  g.selectAll('*').remove();
  // generation labels
  for(let d=1; d<=ui.ancGen; d++){ if(aRoot.descendants().some(n=>n.depth===d&&n.data.p)){ const xs=aRoot.descendants().filter(n=>n.depth===d).map(n=>n.x); g.append('text').attr('class','gen-label').attr('x',Math.min(...xs)-CW/2).attr('y',-d*(CH+56)-CH/2-8).text(['','Föräldrar','Farföräldrar & morföräldrar','Farfars- och morfarsföräldrar','Generation 4','Generation 5','Generation 6'][d]||('Generation '+d)); } }
  g.selectAll('path.link').data(links).join('path').attr('class',l=>'link'+(l.type==='sp'?' sp':'')).attr('d',lp);
  const sel=ui.sel&&ui.sel.type==='person'?ui.sel.id:null;
  const cards=g.selectAll('g.node').data(nodes).join('g').attr('transform',n=>`translate(${n.x-CW/2},${n.y-CH/2})`);
  cards.each(function(n){
    const el=d3.select(this), d=n.data;
    if(d.ghost){
      el.attr('class','ghost');
      el.append('rect').attr('width',CW).attr('height',CH).attr('rx',9);
      el.append('text').attr('x',CW/2).attr('y',CH/2+4).attr('text-anchor','middle').text('+ Lägg till '+(d.ghost==='father'?'far':'mor'));
      el.on('click',()=>openPersonModal(null,{rel:d.ghost,of:d.of}));
      return;
    }
    const p=d.p;
    el.attr('class','card'+(n.focus?' focus':'')+(sel===p.id?' sel':''));
    el.append('rect').attr('class','bg').attr('width',CW).attr('height',CH).attr('rx',9);
    el.append('rect').attr('width',5).attr('height',CH-16).attr('x',0).attr('y',8).attr('rx',2).style('fill',sexColor(p));
    const av=avatarUrl(p); let tx=14;
    if(av){el.append('image').attr('href',av).attr('x',8).attr('y',CH/2-20).attr('width',40).attr('height',40).attr('preserveAspectRatio','xMidYMid slice').attr('clip-path','url(#avclip)'); tx=56;}
    const maxc=av?18:23;
    const nm=fullName(p); el.append('text').attr('class','nm').attr('x',tx).attr('y',23).text(nm.length>maxc?nm.slice(0,maxc-1)+'…':nm).append('title').text(nm);
    el.append('text').attr('class','yr').attr('x',tx).attr('y',40).text(lifespan(p)||'år okänt');
    const pl=placeName(p.birthPlace)||p.occupation||''; el.append('text').attr('class','pl').attr('x',tx).attr('y',56).text(pl.length>maxc+2?pl.slice(0,maxc+1)+'…':pl);
    const nc=(p.citations||[]).length; if(!nc){el.append('circle').attr('cx',CW-11).attr('cy',11).attr('r',3.5).style('fill','var(--warn)').append('title').text('Ingen källa ännu');}
    el.on('click',()=>{ if(n.focus){select('person',p.id);} else {setFocus(p.id); ui.treeKey=null; select('person',p.id);} });
  });
  // fit
  const key=F.id+'|'+ui.ancGen+'|'+ui.descGen;
  if(ui.treeKey!==key){
    ui.treeKey=key;
    const W=$('#treeSvg').clientWidth,H=$('#treeSvg').clientHeight;
    const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
    const x0=Math.min(...xs)-CW/2-30,x1=Math.max(...xs)+CW/2+30,y0=Math.min(...ys)-CH/2-40,y1=Math.max(...ys)+CH/2+30;
    let k=Math.min(1.05,Math.min(W/(x1-x0),(H-60)/(y1-y0)));
    let cx=(x0+x1)/2, cy=(y0+y1)/2;
    if(k<.6){k=.6; cx=Math.max(x0+W/(2*k),Math.min(x1-W/(2*k),CW)); cy=Math.max(y0+(H-60)/(2*k),Math.min(y1-(H-60)/(2*k),0));}
    const t=d3.zoomIdentity.translate(W/2-k*cx,(H+50)/2-k*cy).scale(k);
    svg.transition().duration(fresh?0:450).call(treeZoom.transform,t);
  }
}

function personByLabel(label){label=norm(label); if(!label) return null; const all=Object.values(S.persons); return all.find(x=>norm(personLabel(x))===label)||(()=>{const m=all.filter(x=>norm(fullName(x))===label); return m.length===1?m[0]:null;})();}

function shrinkImage(file,max=900,q=.8){
  return new Promise((res,rej)=>{const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));};
    img.onerror=()=>{URL.revokeObjectURL(url); rej(new Error('Kunde inte läsa bilden'));}; img.src=url;});
}
async function uploadMedia(files,{profile}={}){
  files=[...files]; if(!files.length) return;
  const prog=$('#uplprog'); if(prog) prog.innerHTML=`<div class="small muted">Laddar upp ${files.length} fil(er)…</div><div class="progress"><i></i></div>`;
  const added=[]; let i=0;
  for(const file of files){
    try{
      if(E.assets){const r=await E.assets.upload(file); added.push({assetId:r.id,url:r.url,name:file.name,contentType:r.contentType||file.type,caption:''});}
      else{ if(!/^image\//.test(file.type)) throw new Error('bara bilder kan sparas här'); const url=await shrinkImage(file,Store.mode==='db'?600:900,Store.mode==='db'?.72:.8); added.push({url,name:file.name,contentType:'image/jpeg',caption:'',local:true}); }
    }catch(e){toast('Kunde inte ladda upp '+file.name+(e&&e.message?': '+e.message:''));}
    i++; const bar=prog&&prog.querySelector('i'); if(bar) bar.style.width=(100*i/files.length)+'%';
  }
  if(!added.length){if(prog) prog.innerHTML=''; return;}
  const cur=clone(currentSelObj()); cur.media=cur.media||[];
  const hasProfile=cur.media.some(m=>m.profile);
  if(profile||(!hasProfile&&!cur.media.some(isImg))){ const first=added.find(isImg); if(first){cur.media.forEach(m=>delete m.profile); first.profile=true;} }
  cur.media=cur.media.concat(added); Store.put(cur);
}
function bindMedia(){
  const pn=$('#panel'); const o=currentSelObj(); if(!o) return;
  const up=pn.querySelector('#upl'); if(up) up.onchange=()=>uploadMedia(up.files);
  const av=pn.querySelector('#uplAv'); if(av) av.onchange=()=>uploadMedia(av.files,{profile:true});
  pn.querySelectorAll('[data-media]').forEach(el=>el.onclick=()=>openLightbox(o,+el.dataset.media));
}
function currentSelObj(){if(!ui.sel) return null; return ui.sel.type==='person'?P(ui.sel.id):ui.sel.type==='place'?S.places[ui.sel.id]:S.sources[ui.sel.id];}
function openLightbox(o,i){
  const m=o.media[i]; const isImg=/^image\//.test(m.contentType||'');
  const lb=document.createElement('div'); lb.className='lightbox';
  lb.innerHTML=`${isImg?`<img src="${esc(m.url)}" alt="">`:`<div style="font-size:48px">📄</div><p>${esc(m.name)}</p><a class="btn" href="${esc(m.url)}" target="_blank" rel="noopener" style="color:var(--ink)">Öppna dokumentet</a>`}
    <div class="cap">${E.canEdit?`<input class="t" id="lbCap" style="width:320px;max-width:60vw" placeholder="Bildtext, t.ex. 'Konfirmation 1902'" value="${esc(m.caption||'')}"><button class="btn" id="lbSave">Spara text</button>${isImg&&ui.sel&&ui.sel.type==='person'&&!m.profile?'<button class="btn" id="lbProf">Använd som profilbild</button>':''}<button class="btn danger" id="lbDel">Ta bort</button>`:`<span>${esc(m.caption||'')}</span>`}<button class="btn" id="lbClose">Stäng</button></div>`;
  document.body.appendChild(lb);
  const close=()=>lb.remove();
  lb.onclick=e=>{if(e.target===lb) close();};
  $('#lbClose').onclick=close;
  if(E.canEdit){
    $('#lbSave').onclick=()=>{const c=clone(currentSelObj()); c.media[i].caption=$('#lbCap').value; Store.put(c); close();};
    const pb=$('#lbProf'); if(pb) pb.onclick=()=>{const c=clone(currentSelObj()); c.media.forEach((x,j)=>{if(j===i) x.profile=true; else delete x.profile;}); Store.put(c); close(); toast('Profilbilden är bytt');};
    $('#lbDel').onclick=()=>{close(); confirmBox('Ta bort filen?','Filen tas bort från arkivet för gott.','Ta bort',async()=>{const c=clone(currentSelObj()); const [rm]=c.media.splice(i,1); await Store.put(c); if(rm&&rm.assetId&&E.assets){try{await E.assets.delete(rm.assetId);}catch(e){}}});};
  }
}
async function deletePerson(id){
  const others=Object.values(S.persons).filter(x=>x.id!==id&&(x.fatherId===id||x.motherId===id||(x.spouseIds||[]).includes(id)||(x.events||[]).some(e=>e.withId===id)));
  for(const o of others){const q=clone(o); if(q.fatherId===id) q.fatherId=''; if(q.motherId===id) q.motherId=''; q.spouseIds=(q.spouseIds||[]).filter(x=>x!==id); (q.events||[]).forEach(e=>{if(e.withId===id) e.withId='';}); Store.put(q,{silent:true});}
  if(ui.focus===id) ui.focus=null;
  ui.sel=null; Store.del('person',id);
}

/* ============ Modal ============ */
function modal(html,onMount){
  const ov=document.createElement('div'); ov.className='ov'; ov.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener('keydown',kd);};
  const kd=e=>{if(e.key==='Escape') close();};
  document.addEventListener('keydown',kd);
  ov.addEventListener('mousedown',e=>{if(e.target===ov) close();});
  onMount&&onMount(ov,close); return close;
}
function confirmBox(title,text,okLabel,onOk){
  modal(`<h3>${esc(title)}</h3><p style="color:var(--ink2);line-height:1.5">${esc(text)}</p><div class="foot"><button class="btn" data-x>Avbryt</button><button class="btn primary" style="background:var(--err);border-color:var(--err)" data-ok>${esc(okLabel)}</button></div>`,(ov,close)=>{ov.querySelector('[data-x]').onclick=close; ov.querySelector('[data-ok]').onclick=()=>{close();onOk();};});
}
function openPersonModal(p,ctx){
  const isNew=!p; ctx=ctx||{};
  const base=ctx.of?P(ctx.of):null;
  p=p?clone(p):{kind:'person',id:uid('p'),given:'',surname:'',sex:ctx.rel==='father'?'M':ctx.rel==='mother'?'K':'',citations:[],events:[],media:[],spouseIds:[]};
  // prefill for relations
  if(isNew&&base){
    if(ctx.rel==='child'){ if(base.sex==='K') p.motherId=base.id; else p.fatherId=base.id; const ps=partners(base); if(ps.length===1){const o=ps[0]; if(o.sex==='K'&&!p.motherId) p.motherId=o.id; else if(!p.fatherId) p.fatherId=o.id; else p.motherId=o.id;} p.surname=base.sex!=='K'?patronym(base):''; }
    if(ctx.rel==='partner'){p.sex=base.sex==='M'?'K':base.sex==='K'?'M':'';}
  }
  const relTitle={father:'far till',mother:'mor till',child:'barn till',partner:'partner till'}[ctx.rel];
  const pl=id=>esc(id&&P(id)?personLabel(P(id)):'');
  modal(`<h3>${isNew?(base?'Lägg till '+relTitle+' '+esc(fullName(base)):'Ny person'):'Redigera '+esc(fullName(p))}</h3>
    ${isNew&&base?`<label class="f"><span>Välj en befintlig person istället (valfritt)</span><input class="t" id="mExisting" list="dlPersons" placeholder="Skriv för att söka…">${personOptions(base.id)}<div class="hint">Lämna tomt för att skapa en ny person.</div></label><hr style="border:none;border-top:1px solid var(--paper2);margin:14px 0">`:''}
    <div class="row2"><label class="f"><span>Förnamn</span><input class="t" id="mG" value="${esc(p.given)}" placeholder="t.ex. Anna Maria"></label>
    <label class="f"><span>Efternamn</span><input class="t" id="mS" value="${esc(p.surname)}" placeholder="t.ex. Larsdotter"></label></div>
    <div class="row2"><label class="f"><span>Kön</span><select class="t" id="mSex"><option value="">Okänt</option><option value="M" ${p.sex==='M'?'selected':''}>Man</option><option value="K" ${p.sex==='K'?'selected':''}>Kvinna</option></select></label>
    <label class="f"><span>Yrke / titel</span><input class="t" id="mO" value="${esc(p.occupation||'')}" placeholder="t.ex. Bonde, Piga, Soldat"></label></div>
    <div class="row2"><label class="f"><span>Född (datum)</span><input class="t" id="mBD" value="${esc(p.birthDate||'')}" placeholder="1823-04-12, 1823 eller ca 1820"></label>
    <label class="f"><span>Födelseort</span><input class="t" id="mBP" list="dlPlaces" value="${esc(placeName(p.birthPlace))}" placeholder="Församling eller ort"></label></div>
    <div class="row2"><label class="f"><span>Död (datum)</span><input class="t" id="mDD" value="${esc(p.deathDate||'')}"></label>
    <label class="f"><span>Dödsort</span><input class="t" id="mDP" list="dlPlaces" value="${esc(placeName(p.deathPlace))}"></label></div>
    ${placeOptions()}
    ${ctx.rel==='father'||ctx.rel==='mother'?'':`<div class="row2"><label class="f"><span>Far</span><input class="t" id="mF" list="dlPersons2" value="${pl(p.fatherId)}" placeholder="Sök befintlig person"></label>
    <label class="f"><span>Mor</span><input class="t" id="mM" list="dlPersons2" value="${pl(p.motherId)}" placeholder="Sök befintlig person"></label></div>
    <datalist id="dlPersons2">${Object.values(S.persons).filter(x=>x.id!==p.id).map(x=>`<option value="${esc(personLabel(x))}">`).join('')}</datalist>`}
    <div class="foot"><button class="btn" data-x>Avbryt</button><button class="btn primary" data-ok>${isNew?'Lägg till':'Spara'}</button></div>`,
  (ov,close)=>{
    const q=s=>ov.querySelector(s);
    q('#mG').focus();
    q('[data-x]').onclick=close;
    q('[data-ok]').onclick=async()=>{
      let target=null;
      if(q('#mExisting')&&q('#mExisting').value.trim()){target=personByLabel(q('#mExisting').value); if(!target){toast('Hittade ingen sådan person – välj i listan.');return;} target=clone(target);}
      if(!target){
        const g=q('#mG').value.trim(),s=q('#mS').value.trim(); if(!g&&!s){q('#mG').focus();toast('Skriv minst ett namn.');return;}
        Object.assign(p,{given:g,surname:s,sex:q('#mSex').value,occupation:q('#mO').value.trim(),birthDate:q('#mBD').value.trim(),deathDate:q('#mDD').value.trim()});
        const bp=ensurePlace(q('#mBP').value),dp=ensurePlace(q('#mDP').value);
        if(bp.created) Store.put(bp.created,{silent:true}); if(dp.created&&dp.created!==bp.created) Store.put(dp.created,{silent:true});
        p.birthPlace=bp.id; p.deathPlace=dp.id;
        if(q('#mF')){const fv=q('#mF').value.trim(),mv=q('#mM').value.trim(); const f=personByLabel(fv),m=personByLabel(mv);
          if(fv&&!f){toast('Hittade inte fadern i listan.');return;} if(mv&&!m){toast('Hittade inte modern i listan.');return;}
          p.fatherId=f?f.id:''; p.motherId=m?m.id:'';}
        if(isNew) p.createdAt=new Date().toISOString();
        target=p;
      }
      close();
      // relation wiring
      if(base&&ctx.rel){
        const b=clone(P(base.id));
        if(ctx.rel==='father'){b.fatherId=target.id; if(!target.sex) target.sex='M';}
        if(ctx.rel==='mother'){b.motherId=target.id; if(!target.sex) target.sex='K';}
        if(ctx.rel==='partner'){b.spouseIds=[...new Set([...(b.spouseIds||[]),target.id])]; target.spouseIds=[...new Set([...(target.spouseIds||[]),b.id])];

        }
        if(ctx.rel==='child'&&target!==p){ if(b.sex==='K') target.motherId=b.id; else target.fatherId=b.id; }
        // if adding a parent and the other parent exists, make them partners
        if((ctx.rel==='father'||ctx.rel==='mother')){const other=P(ctx.rel==='father'?b.motherId:b.fatherId); if(other){target.spouseIds=[...new Set([...(target.spouseIds||[]),other.id])]; const o=clone(other); o.spouseIds=[...new Set([...(o.spouseIds||[]),target.id])]; Store.put(o,{silent:true});}}
        await Store.put(target,{silent:true}); Store.put(b,{silent:true});
      } else { Store.put(target,{silent:true}); }
      if(!ui.focus) setFocus(target.id);
      if(ui.view==='trad') ui.treeKey=null;
      ui.sel={type:'person',id:(ctx.rel==='father'||ctx.rel==='mother')&&base?base.id:target.id};
      if(isNew&&!base) {setFocus(target.id); ui.sel={type:'person',id:target.id};}
      renderAll();
    };
    ov.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT') q('[data-ok]').click();});
  });
}
function patronym(f){
  // Suggest a family surname: keep father's surname unless it's a patronymic
  const s=f.surname||''; if(/(son|dotter)$/i.test(s)) return ''; return s;
}

function replacePlace(from,to){
  for(const p of Object.values(S.persons)){
    let ch=false; const q=clone(p);

function renderTimeline(){
  const v=$('#view'); const all=Object.values(S.persons);
  if(!all.length){v.innerHTML=emptyState();return;}
  const scope=scopeSet(ui.tlScope);
  const ppl=all.filter(p=>!scope||scope.has(p.id));
  const rows=[];
  for(const p of ppl){
    const b=dateKey(p.birthDate),d=dateKey(p.deathDate);
    const evs=(p.events||[]).map(e=>({e,k:dateKey(e.date)})).filter(x=>x.k!=null);
    let s=b,t=d,fs=false,ft=false;
    if(s==null&&t!=null){s=t-60;fs=true;}
    if(s==null&&evs.length){s=Math.min(...evs.map(x=>x.k))-20;fs=true;}
    if(s==null) continue;
    if(t==null){ if(s>NOW_Y-105&&!fs){t=NOW_Y+0.5;} else {t=Math.max(s+70,...evs.map(x=>x.k));ft=true;} }
    rows.push({p,s,t,fs,ft,evs,alive:t>=NOW_Y&&!ft&&!p.deathDate});
  }
  rows.sort((a,b)=>a.s-b.s);
  const skipped=ppl.length-rows.length;
  const LW=190,RH=24,TOP=74;
  v.innerHTML=`<div class="view-pad" style="max-width:none">
    <div class="toolbar"><h2>Tidslinje</h2>

      <label class="check" style="margin:0"><input type="checkbox" id="tlHist" ${ui.tlHist?'checked':''}> Historiska händelser</label>

    ${skipped?`<p class="small muted">${skipped} person(er) saknar datum och visas inte.</p>`:''}
    <div class="evlist"><h3 style="font-size:18px;margin-bottom:10px">Alla händelser i tidsordning</h3><div id="tlList"></div></div></div>`;
  v.querySelectorAll('#tlScope button').forEach(b=>b.onclick=()=>{ui.tlScope=b.dataset.k;renderTimeline();});
  $('#tlHist').onchange=e=>{ui.tlHist=e.target.checked;renderTimeline();};
  // event list

  $('#tlList').innerHTML=list.length?`<table class="list"><thead><tr><th style="width:120px">Datum</th><th>Händelse</th><th>Person</th><th>Plats</th></tr></thead><tbody>${list.map(r=>`<tr class="click" data-id="${r.p.id}"><td>${esc(r.e.date)}</td><td>${esc(r.e.type)}${r.e.desc?`<div class="small muted">${esc(r.e.desc)}</div>`:''}</td><td><span class="dot" style="background:${sexColor(r.p)}"></span>${esc(fullName(r.p))}</td><td>${esc(placeName(r.e.placeId))}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Inga daterade händelser.</p>';
  $('#tlList').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>showPerson(tr.dataset.id));
  if(!rows.length) return;
  const box=$('#tlChart'); const W=Math.max(box.clientWidth,760); const H=TOP+rows.length*RH+16;
  const x0=Math.floor((d3.min(rows,r=>r.s)-5)/10)*10, x1=Math.min(NOW_Y+5,Math.ceil((d3.max(rows,r=>r.t)+5)/10)*10);
  const x=d3.scaleLinear().domain([x0,x1]).range([LW,W-20]);

    hs.forEach((h,i)=>{const xa=x(h.a),xb=Math.max(x(h.b+1),xa+2); hg.append('rect').attr('class','hist-band').attr('x',xa).attr('y',TOP-6).attr('width',xb-xa).attr('height',H-TOP); hg.append('text').attr('class','hist-lbl').attr('x',xa>W-200?xb-2:xa+2).attr('text-anchor',xa>W-200?'end':'start').attr('y',TOP-10-(i%3)*12).text(h.t).append('title').text(h.a===h.b?h.a+': '+h.t:h.a+'–'+h.b+': '+h.t);});

  const sel=ui.sel&&ui.sel.type==='person'?ui.sel.id:null;

  g.append('text').attr('class','tl-name').attr('x',12).attr('y',RH/2+4).text(r=>{const n=fullName(r.p);return n.length>24?n.slice(0,23)+'…':n;}).on('click',(e,r)=>showPerson(r.p.id));
  g.each(function(r){
    const el=d3.select(this); const s=r.p.sex==='M'?'M':r.p.sex==='K'?'K':'U'; const col={M:cssv('--male'),K:cssv('--female'),U:cssv('--unk')}[s];
    const xa=x(r.s),xb=x(r.t),y=RH/2-4;
    el.append('rect').attr('x',xa).attr('y',y).attr('width',Math.max(2,xb-xa)).attr('height',8).attr('rx',4).attr('fill',r.ft?`url(#fr${s})`:r.fs?`url(#fl${s})`:col).attr('opacity',.85).style('cursor','pointer').on('click',()=>showPerson(r.p.id))

    for(const ev of r.evs){el.append('circle').attr('cx',x(ev.k)).attr('cy',RH/2).attr('r',4.2).attr('fill',cssv('--card')).attr('stroke',col).attr('stroke-width',1.8).append('title').text(`${ev.e.type} ${ev.e.date}${ev.e.placeId?' – '+placeName(ev.e.placeId):''}`);}
    if(!r.fs) el.append('circle').attr('cx',xa).attr('cy',RH/2).attr('r',2.5).attr('fill',cssv('--card'));
  });

/* ============ MAP ============ */
const mapState={world:null,loading:false,drawn:false,proj:null,zoom:null,k:1,focusPlace:null};
async function loadWorld(){
  if(mapState.world||mapState.loading) return; mapState.loading=true;
  try{const r=await fetch('map/world.json'); const t=await r.json(); mapState.world=topojson.feature(t,t.objects.countries).features;}catch(e){mapState.world=[];toast('Kunde inte ladda kartan');}
  mapState.loading=false; if(ui.view==='karta'){mapState.drawn=false; renderMap();}
}
function placeStats(scope){
  const st={};
  for(const p of Object.values(S.persons)){ if(scope&&!scope.has(p.id)) continue;
    for(const e of lifeEvents(p)) if(e.placeId){(st[e.placeId]=st[e.placeId]||{n:0,people:new Set()}).n++; st[e.placeId].people.add(p.id);} }
  return st;
}
function renderMap(fresh){
  const v=$('#view');
  const scope=scopeSet(ui.mapScope); const st=placeStats(scope);
  const places=Object.values(S.places);
  const used=places.filter(pl=>st[pl.id]||!scope).sort((a,b)=>(st[b.id]?.n||0)-(st[a.id]?.n||0)||a.name.localeCompare(b.name,'sv'));
  const withC=used.filter(pl=>pl.lat!=null), without=used.filter(pl=>pl.lat==null);
  const placingPl=ui.placing?S.places[ui.placing]:null;
  if(!$('#mapSvg')||fresh){
    v.innerHTML=`<div id="mapWrap"><svg id="mapSvg"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--err)"/></marker></defs><g class="vp"><g class="lands"></g><g class="routes"></g><g class="mks"></g></g></svg>
      <div class="map-side" id="mapSide"></div><div id="mapBanner"></div>
      <div class="map-zoom"><button id="zIn" title="Zooma in">+</button><button id="zOut" title="Zooma ut">−</button></div></div>`;
    mapState.drawn=false;
    const svg=d3.select('#mapSvg');
    mapState.zoom=d3.zoom().scaleExtent([.5,60]).on('zoom',e=>{mapState.k=e.transform.k; svg.select('g.vp').attr('transform',e.transform); svg.selectAll('.mk').attr('transform',function(){return this.dataset.t+` scale(${1/e.transform.k})`;});});
    svg.call(mapState.zoom).on('dblclick.zoom',null);
    $('#zIn').onclick=()=>svg.transition().call(mapState.zoom.scaleBy,1.6);
    $('#zOut').onclick=()=>svg.transition().call(mapState.zoom.scaleBy,1/1.6);
    svg.on('click',e=>{
      if(!ui.placing||!mapState.proj) return;
      const [mx,my]=d3.pointer(e,svg.select('g.vp').node()); const ll=mapState.proj.invert([mx,my]);
      const pl=clone(S.places[ui.placing]); pl.lat=+ll[1].toFixed(5); pl.lon=+ll[0].toFixed(5); ui.placing=null; ui.sel={type:'place',id:pl.id}; Store.put(pl); toast('📍 '+pl.name+' placerad');

  }
  // side panel
  $('#mapSide').innerHTML=`<h3>Platser</h3>
    <div class="seg" style="margin-bottom:10px" id="mpScope">${[['alla','Alla'],['anor','Anor'],['attlingar','Ättlingar']].map(([k,t])=>`<button data-k="${k}" class="${ui.mapScope===k?'on':''}">${t}</button>`).join('')}</div>
    ${ui.sel&&ui.sel.type==='person'?`<label class="check small"><input type="checkbox" id="mpRoute" ${ui.mapRoute?'checked':''}> Visa ${esc(P(ui.sel.id).given?genitive(P(ui.sel.id).given):'vald persons')} livsväg</label>`:'<div class="small muted" style="margin-bottom:6px">Välj en person för att se dennes livsväg.</div>'}

    <div class="small muted" style="margin:10px 0 4px;font-weight:600">På kartan (${withC.length})</div>
    ${withC.map(pl=>`<div class="pl-item" data-pl="${pl.id}"><span class="dot" style="background:var(--accent)"></span><span class="n">${esc(pl.name)}</span><span class="small muted">${st[pl.id]?st[pl.id].people.size+' pers.':''}</span></div>`).join('')||'<div class="small muted">Inga ännu.</div>'}`;
  $('#mapSide').querySelectorAll('#mpScope button').forEach(b=>b.onclick=()=>{ui.mapScope=b.dataset.k;mapState.drawn=false;renderMap();});
  const rt=$('#mpRoute'); if(rt) rt.onchange=()=>{ui.mapRoute=rt.checked;renderMap();};

  if(placingPl) $('#cancelPlace').onclick=e=>{e.stopPropagation();ui.placing=null;renderMap();};
  $('#mapSvg').style.cursor=placingPl?'crosshair':'grab';
  if(!mapState.world) return;
  const svg=d3.select('#mapSvg'); const W=$('#mapSvg').clientWidth,H=$('#mapSvg').clientHeight;
  if(!mapState.drawn){

    const pts=withC.map(pl=>[pl.lon,pl.lat]);
    let bb; if(pts.length){const mLo=d3.median(pts,p=>p[0]),mLa=d3.median(pts,p=>p[1]); const core=pts.filter(p=>Math.abs(p[0]-mLo)<22&&Math.abs(p[1]-mLa)<13); const use=core.length?core:pts; const lo=d3.extent(use,p=>p[0]),la=d3.extent(use,p=>p[1]); const pad=Math.max(1.2,(lo[1]-lo[0])*.12); bb=[[lo[0]-pad,la[0]-pad*.6],[lo[1]+pad,la[1]+pad*.6]];} else bb=[[4,54.5],[31,69.5]];

    const path=d3.geoPath(mapState.proj);

function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX) return res(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=()=>rej(new Error('Kunde inte ladda Excel-läsaren')); document.head.appendChild(s);});}
async function readImportFile(file){
  try{
    if(/\.(csv|tsv|txt)$/i.test(file.name)){ setImportRows(parseDelimited(await file.text())); return; }
    await loadXLSX();
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    imp.wb=wb; imp.sheets=wb.SheetNames;
    useSheet(wb.SheetNames[0]);
  }catch(e){toast('Kunde inte läsa filen: '+(e.message||e));}
}
function useSheet(name){
  const ws=imp.wb.Sheets[name];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const cell=c=>{ if(c instanceof Date&&!isNaN(c)){const d=new Date(c.getTime()+12*3600e3); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');} return String(c??'').trim(); };

function parseDelimited(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const cand=['\t',';',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1]); const D=cand[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"'&&cur==='') q=true;
    else if(c===D){row.push(cur.trim());cur='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur.trim()); rows.push(row); row=[];cur=''; }
    else cur+=c;}
  if(cur||row.length){row.push(cur.trim());rows.push(row);}
  return rows;
}
function setImportRows(rows){

function mapRow(r){

  const fn=g('fullname'); if(fn&&!o.given&&!o.surname){const parts=fn.split(/\s+/); o.surname=parts.length>1?parts.pop():''; o.given=parts.join(' ');}
  const sx=norm(g('sex')); o.sex=/^(m|man|male|pojke|herr)$/.test(sx)?'M':/^(k|kvinna|f|female|flicka|fru|kv)$/.test(sx)?'K':'';

async function runImport(){

  const byRef={},byName={};
  const existing=Object.values(S.persons);
  const key=(n,y)=>norm(n)+'|'+(y||'');
  const addName=(p)=>{const n=norm(fullName(p)); (byName[n]=byName[n]||[]).push(p);};
  existing.forEach(addName);
  const place=name=>{const r=ensurePlace(name); if(r.created) newPlaces[r.id]=r.created; return r.id;};
  let skipped=0;
  const now=new Date().toISOString();
  for(const r of rows){
    if(imp.skipDup){const ex=existing.find(p=>key(fullName(p),yearOf(p.birthDate))===key([r.given,r.surname].filter(Boolean).join(' '),yearOf(r.birthDate))); if(ex){skipped++; if(r.ref) byRef[norm(r.ref)]=ex; continue;}}

  }
  let linked=0,made=0,unres=[];

    if(!val) return null; const n=norm(val);
    if(byRef[n]) return byRef[n];
    const m=byName[n]; if(m&&m.length) return m.length===1?m[0]:(m.find(x=>!sex||x.sex===sex)||m[0]);
    if(/^\d+$/.test(n)){unres.push(val); return null;}
    if(!imp.createMissing){unres.push(val); return null;}
    const parts=val.trim().split(/\s+/); const sn=parts.length>1?parts.pop():'';
    const np={kind:'person',id:uid('p'),given:parts.join(' '),surname:sn,sex:sex||'',events:[],citations:[],media:[],spouseIds:[],createdAt:now};
    created.push(np); addName(np); made++; return np;
  };
  const touched=new Map();

    if(m){p.motherId=m.id; if(!m.sex) m.sex='K'; linked++; if(!created.includes(m)) touched.set(m.id,m);}
    if(f&&m){ for(const [a,b] of [[f,m],[m,f]]){ const x=created.includes(a)?a:(touched.get(a.id)||clone(a)); x.spouseIds=[...new Set([...(x.spouseIds||[]),b.id])]; if(!created.includes(a)) touched.set(a.id,x);} }

    <div class="foot"><a class="btn" href="#karta" data-x>Till kartan</a><a class="btn primary" href="#trad" data-x>Visa släktträdet</a></div>`,(ov,close)=>ov.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',close)));
}
async function saveFile(name,data){

}

function gedDate(s){
  if(!s) return ''; s=String(s).trim(); const M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  let pre=''; if(/^(ca|cirka|omkr|omkring|~)/i.test(s)) pre='ABT '; else if(/^(före|fore|innan)/i.test(s)) pre='BEF '; else if(/^(efter)/i.test(s)) pre='AFT ';
  const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return pre+(+m[3])+' '+M[+m[2]-1]+' '+m[1];
  const m2=s.match(/(\d{4})-(\d{1,2})/); if(m2) return pre+M[+m2[2]-1]+' '+m2[1];
  const y=yearOf(s); return y?pre+y:s;
}
function toGedcom(){
  const L=[]; const add=(lvl,tag,val)=>{val=val==null?'':String(val).replace(/\r?\n/g,' '); L.push(lvl+' '+tag+(val?' '+val:''));};
  const note=(lvl,txt)=>{const lines=String(txt).split(/\r?\n/); add(lvl,'NOTE',lines[0]); lines.slice(1).forEach(l=>add(lvl+1,'CONT',l));};
  const iid={},sid={}; let n=1; Object.values(S.persons).forEach(p=>iid[p.id]='@I'+(n++)+'@'); n=1; Object.values(S.sources).forEach(s=>sid[s.id]='@S'+(n++)+'@');
  const fams={}; const famKey=(a,b)=>[a||'',b||''].join('+');
  const getFam=(h,w)=>{const k=famKey(h,w); return fams[k]=fams[k]||{id:'@F'+(Object.keys(fams).length+1)+'@',h,w,c:[]};};
  for(const p of Object.values(S.persons)){ if(p.fatherId||p.motherId) getFam(P(p.fatherId)?p.fatherId:'',P(p.motherId)?p.motherId:'').c.push(p.id); }
  for(const p of Object.values(S.persons)) for(const s of partners(p)){ const [h,w]=p.sex==='K'?[s.id,p.id]:[p.id,s.id]; if(!fams[famKey(h,w)]&&!fams[famKey(w,h)]) getFam(h,w); }
  add(0,'HEAD'); add(1,'SOUR','SLAKTARKIVET'); add(2,'NAME','Släktarkivet'); add(1,'GEDC'); add(2,'VERS','5.5.1'); add(2,'FORM','LINEAGE-LINKED'); add(1,'CHAR','UTF-8'); add(1,'DATE',gedDate(new Date().toISOString().slice(0,10)));
  const TAG={Dop:'BAPM',Konfirmation:'CONF',Begravning:'BURI',Utvandring:'EMIG',Invandring:'IMMI',Bosatt:'RESI',Yrke:'OCCU',Bouppteckning:'PROB',Militärtjänst:'_MILT'};
  const cites=(p,lvl,about)=>{for(const c of (p.citations||[]).filter(c=>c.about===about)) if(sid[c.sourceId]){add(lvl,'SOUR',sid[c.sourceId]); if(c.detail) add(lvl+1,'PAGE',c.detail);}};
  for(const p of Object.values(S.persons)){
    add(0,iid[p.id],'INDI'); add(1,'NAME',`${p.given||''} /${p.surname||''}/`.trim()); if(p.given) add(2,'GIVN',p.given); if(p.surname) add(2,'SURN',p.surname);
    if(p.sex) add(1,'SEX',p.sex==='K'?'F':'M');
    if(p.birthDate||p.birthPlace){add(1,'BIRT'); if(p.birthDate) add(2,'DATE',gedDate(p.birthDate)); if(p.birthPlace) add(2,'PLAC',placeName(p.birthPlace)); cites(p,2,'Födelse');}
    if(p.deathDate||p.deathPlace){add(1,'DEAT'); if(p.deathDate) add(2,'DATE',gedDate(p.deathDate)); if(p.deathPlace) add(2,'PLAC',placeName(p.deathPlace)); cites(p,2,'Död');}
    if(p.occupation) add(1,'OCCU',p.occupation);
    for(const e of p.events||[]){ const t=TAG[e.type]; if(t&&!t.startsWith('_')){add(1,t,t==='OCCU'?e.desc:'');} else {add(1,'EVEN',e.desc||''); add(2,'TYPE',e.type);} if(e.date) add(2,'DATE',gedDate(e.date)); if(e.placeId) add(2,'PLAC',placeName(e.placeId)); if(e.desc&&t&&t!=='OCCU') note(2,e.desc); cites(p,2,'event:'+e.id); }
    cites(p,1,''); for(const a of ['Föräldrar','Namn','Yrke']) cites(p,1,a);
    if(p.notes) note(1,p.notes);
    for(const f of Object.values(fams)){ if(f.c.includes(p.id)) add(1,'FAMC',f.id); if(f.h===p.id||f.w===p.id) add(1,'FAMS',f.id); }
  }
  for(const f of Object.values(fams)){ add(0,f.id,'FAM'); if(f.h) add(1,'HUSB',iid[f.h]); if(f.w) add(1,'WIFE',iid[f.w]); f.c.forEach(c=>add(1,'CHIL',iid[c]));
    const h=P(f.h); const mar=h&&(h.events||[]).find(e=>e.type==='Vigsel'&&e.withId===f.w); if(mar){add(1,'MARR'); if(mar.date) add(2,'DATE',gedDate(mar.date)); if(mar.placeId) add(2,'PLAC',placeName(mar.placeId));} }
  for(const s of Object.values(S.sources)){ add(0,sid[s.id],'SOUR'); add(1,'TITL',s.title); if(s.archive) add(1,'REPO',s.archive); if(s.ref) add(1,'PUBL',s.ref); if(s.url) add(1,'WWW',s.url); if(s.notes) note(1,s.notes); }
  add(0,'TRLR'); return L.join('\r\n');
}

function storyOf(p){
  const he=p.sex==='K'?'hon':p.sex==='M'?'han':'hen', He=he[0].toUpperCase()+he.slice(1);
  const name=fullName(p), out=[];
  const f=P(p.fatherId), m=P(p.motherId);
  const child=p.sex==='K'?'dotter':p.sex==='M'?'son':'barn';
  if(p.birthDate||p.birthPlace){
    let t=`${name} föddes${p.birthDate?' '+whenText(p.birthDate):''}${p.birthPlace?' i '+placeName(p.birthPlace):''}`;
    if(f||m) t+=`, ${f&&m?child+' till '+fullName(f)+' och '+fullName(m):child+' till '+fullName(f||m)}`;
    out.push(t+'.');
  } else if(f||m) out.push(`${name} var ${child} till ${f&&m?fullName(f)+' och '+fullName(m):fullName(f||m)}.`);
  if(p.occupation) out.push(`${out.length?He:name} var ${/^[A-ZÅÄÖ][a-zåäö]/.test(p.occupation)?p.occupation[0].toLowerCase()+p.occupation.slice(1):p.occupation}.`);
  const evs=(p.events||[]).filter(e=>e.type!=='Vigsel').sort((a,b)=>(dateKey(a.date)??9e9)-(dateKey(b.date)??9e9));
  const pl=e=>e.placeId?' i '+placeName(e.placeId):'';
  const verbs={Dop:'döptes',Konfirmation:'konfirmerades',Kröning:'kröntes',Begravning:'begravdes',Militärtjänst:'gjorde militärtjänst',Bosatt:'bodde'};
  const parts=partners(p); const kids=children(p.id);
  for(const sp of parts){
    const vig=(p.events||[]).find(e=>e.type==='Vigsel'&&e.withId===sp.id)||(sp.events||[]).find(e=>e.type==='Vigsel'&&e.withId===p.id);
    const married=(p.spouseIds||[]).includes(sp.id)||vig;
    let t=married?`${He} gifte sig${vig&&vig.date?' '+whenText(vig.date):''}${vig&&vig.placeId?' i '+placeName(vig.placeId):''} med ${fullName(sp)}`:`${He} fick barn med ${fullName(sp)}`;
    const ck=kids.filter(c=>c.fatherId===sp.id||c.motherId===sp.id);
    const kl=listJoin(ck.map(c=>(c.given||fullName(c))+(yearOf(c.birthDate)?` (${yearOf(c.birthDate)})`:'')));
    if(ck.length) t+=married?`, och tillsammans fick de ${numw(ck.length)} barn: ${kl}`:` – ${kl}`;
    out.push(t+'.');
  }
  const solo=kids.filter(c=>!parts.some(sp=>c.fatherId===sp.id||c.motherId===sp.id));
  if(solo.length) out.push(`${He} hade ${parts.length?'också ':''}${solo.length===1?'barnet':'barnen'} ${listJoin(solo.map(c=>fullName(c)))}.`);
  for(const e of evs){
    const w=e.date?whenText(e.date):'';
    if(e.type==='Flytt') out.push(`${w?w[0].toUpperCase()+w.slice(1)+' flyttade '+he:He+' flyttade'}${e.placeId?' till '+placeName(e.placeId):''}${e.desc?' – '+e.desc.replace(/\.$/,''):''}.`);
    else if(e.type==='Utvandring') out.push(`${w?w[0].toUpperCase()+w.slice(1)+' utvandrade '+he:He+' utvandrade'}${e.placeId?' via '+placeName(e.placeId):''}${e.desc?' – '+e.desc.replace(/\.$/,''):''}.`);
    else if(verbs[e.type]) out.push(`${He} ${verbs[e.type]}${w?' '+w:''}${pl(e)}${e.desc&&!['Begravning','Kröning'].includes(e.type)?' ('+e.desc.replace(/\.$/,'')+')':''}.`);
    else if(e.desc) out.push(`${w?w[0].toUpperCase()+w.slice(1)+' – ':''}${w?e.desc[0].toLowerCase()+e.desc.slice(1).replace(/\.$/,''):e.desc.replace(/\.$/,'')}${e.placeId&&!e.desc.includes(placeName(e.placeId))?pl(e):''}.`);
  }
  if(p.deathDate||p.deathPlace){const age=ageAt(p); out.push(`${He} dog${p.deathDate?' '+whenText(p.deathDate):''}${p.deathPlace?' i '+placeName(p.deathPlace):''}${age!=null&&age>0?`, ${age} år gammal`:''}.`);}

}

/* ============ DUPLICATES ============ */
function nrm(s){return String(s||'').toLowerCase().normalize('NFC').replace(/[éè]/g,'e').replace(/w/g,'v').replace(/ph/g,'f').replace(/th/g,'t').replace(/ck/g,'k').replace(/c(?=[aou])/g,'k').replace(/q/g,'k').replace(/z/g,'s').replace(/dtr$/,'dotter').replace(/(.)\1+/g,'$1').trim();}

function dupScore(a,b){

  if(a.fatherId===b.id||a.motherId===b.id||b.fatherId===a.id||b.motherId===a.id) return 0;
  if((a.notDup||[]).includes(b.id)||(b.notDup||[]).includes(a.id)) return 0;
  const ga=nrm((a.given||'').split(/\s+/)[0]), gb=nrm((b.given||'').split(/\s+/)[0]);
  if(!ga||!gb) return 0;
  let s=0; const gd=lev(ga,gb); if(gd===0) s+=30; else if(gd===1&&ga.length>3) s+=18; else return 0;
  const sa=nrm(a.surname), sb=nrm(b.surname);
  if(sa&&sb){const d=lev(sa,sb); if(d===0) s+=25; else if(d<=2) s+=15; else s-=25;} else s+=5;
  const ya=yearOf(a.birthDate), yb=yearOf(b.birthDate);
  if(ya&&yb){const d=Math.abs(ya-yb); if(d===0) s+=25; else if(d<=2) s+=14; else if(d>5) return 0; else s-=10;} else s+=4;
  const da=yearOf(a.deathDate), db=yearOf(b.deathDate);
  if(da&&db){const d=Math.abs(da-db); if(d===0) s+=10; else if(d>3) s-=30;}
  if(a.fatherId&&a.fatherId===b.fatherId) s+=15; if(a.motherId&&a.motherId===b.motherId) s+=15;
  if(a.birthPlace&&a.birthPlace===b.birthPlace) s+=10;
  return Math.max(0,Math.min(100,s));
}
function findDups(){
  const all=Object.values(S.persons); const buckets={};
  for(const p of all){const k=nrm((p.given||'').split(/\s+/)[0]).slice(0,2); if(k) (buckets[k]=buckets[k]||[]).push(p);}
  const out=[];
  for(const list of Object.values(buckets)) for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){const sc=dupScore(list[i],list[j]); if(sc>=60) out.push({a:list[i],b:list[j],sc});}
  return out.sort((x,y)=>y.sc-x.sc);
}

async function mergePersons(keepId,dropId){
  const k=clone(P(keepId)), d=P(dropId); if(!k||!d) return;
  for(const f of ['given','surname','sex','birthDate','birthPlace','deathDate','deathPlace','occupation','fatherId','motherId']) if(!k[f]&&d[f]) k[f]=d[f];
  if(d.notes&&d.notes!==k.notes) k.notes=[k.notes,d.notes].filter(Boolean).join('\n\n');
  const evKey=e=>e.type+'|'+(e.date||'')+'|'+(e.placeId||'');
  const evs=(k.events||[]).slice(); for(const e of d.events||[]) if(!evs.some(x=>evKey(x)===evKey(e))) evs.push(e); k.events=evs;
  const cKey=c=>c.sourceId+'|'+(c.about||'')+'|'+(c.detail||'');
  const cs=(k.citations||[]).slice(); for(const c of d.citations||[]) if(!cs.some(x=>cKey(x)===cKey(c))) cs.push(c); k.citations=cs;
  k.media=(k.media||[]).concat((d.media||[]).map(m=>Object.assign({},m,{profile:(k.media||[]).some(x=>x.profile)?false:m.profile})));
  k.spouseIds=[...new Set([...(k.spouseIds||[]),...(d.spouseIds||[])])].filter(x=>x!==keepId&&x!==dropId);
  k.notDup=[...new Set([...(k.notDup||[]),...(d.notDup||[])])].filter(x=>x!==dropId);
  if(d.home) k.home=true;
  await Store.put(k,{silent:true});
  for(const o of Object.values(S.persons)){ if(o.id===keepId||o.id===dropId) continue; let ch=false; const q=clone(o);
    if(q.fatherId===dropId){q.fatherId=keepId;ch=true;} if(q.motherId===dropId){q.motherId=keepId;ch=true;}
    if((q.spouseIds||[]).includes(dropId)){q.spouseIds=[...new Set(q.spouseIds.map(x=>x===dropId?keepId:x))];ch=true;}
    (q.events||[]).forEach(e=>{if(e.withId===dropId){e.withId=keepId;ch=true;}});
    if((q.notDup||[]).includes(dropId)){q.notDup=q.notDup.filter(x=>x!==dropId);ch=true;}
    if(ch) Store.put(q,{silent:true}); }
  if(ui.focus===dropId) setFocus(keepId);
  if(ui.sel&&ui.sel.id===dropId) ui.sel={type:'person',id:keepId};
  await Store.del('person',dropId);

}

/* ============ RELATIONSHIP ============ */
function upMap(id){const m=new Map([[id,{d:0,path:[id]}]]); const q=[id]; while(q.length){const x=q.shift(); const p=P(x); if(!p) continue; for(const k of ['fatherId','motherId']){const y=p[k]; if(y&&P(y)&&!m.has(y)){const path=m.get(x).path.concat(y); m.set(y,{d:path.length-1,path}); q.push(y);}}} return m;}
function blood(a,b){
  const A=upMap(a),B=upMap(b); let best=null;
  for(const [id,ia] of A){const ib=B.get(id); if(ib){const t=ia.d+ib.d; if(!best||t<best.t||(t===best.t&&Math.abs(ia.d-ib.d)<Math.abs(best.a-best.b))) best={id,a:ia.d,b:ib.d,pa:ia.path,pb:ib.path,t};}}
  if(!best) return null;
  best.commons=[...A].filter(([id,ia])=>{const ib=B.get(id); return ib&&ia.d===best.a&&ib.d===best.b;}).map(([id])=>id);
  if(best.a>0&&best.b>0&&best.commons.length===1){const ca=P(best.pa[best.a-1]),cb=P(best.pb[best.b-1]); const oa=ca&&(ca.fatherId===best.id?ca.motherId:ca.fatherId), ob=cb&&(cb.fatherId===best.id?cb.motherId:cb.fatherId); best.half=!!(oa&&ob&&oa!==ob);}
  return best;
