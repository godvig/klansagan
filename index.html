<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinsaga</title>
<meta name="description" content="Kinsaga – build your family history together: family tree, fan chart, sources, timeline, map and life stories. Runs in the browser, no account needed.">
<meta name="theme-color" content="#2f5d50">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26' fill='none' stroke='%232f5d50' stroke-width='1.8'%3E%3Cpath d='M13 24V13M13 13c0-4-3-6-6-6M13 13c0-4 3-6 6-6M13 17c-2-1-5-1-7 1M13 17c2-1 5-1 7 1'/%3E%3Ccircle cx='7' cy='6' r='2.4'/%3E%3Ccircle cx='19' cy='6' r='2.4'/%3E%3Ccircle cx='13' cy='3.6' r='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="src/core.js"></script>
</head>
<body>
<header>
  <a class="brand" href="#trad" id="home" title="Till startsidan">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 24V13M13 13c0-4 -3-6-6-6M13 13c0-4 3-6 6-6M13 17c-2-1-5-1-7 1M13 17c2-1 5-1 7 1"/><circle cx="7" cy="6" r="2.4"/><circle cx="19" cy="6" r="2.4"/><circle cx="13" cy="3.6" r="2"/></svg>
    <span>Kinsaga</span>
  </a>
  <nav id="nav">
    <a href="#start" data-v="start">Start</a>
    <a href="#trad" data-v="trad">Träd</a>
    <a href="#solfjader" data-v="solfjader">Solfjäder</a>
    <a href="#personer" data-v="personer">Personer</a>
    <a href="#slaktskap" data-v="slaktskap">Släktskap</a>
    <a href="#tidslinje" data-v="tidslinje">Tidslinje</a>
    <a href="#karta" data-v="karta">Karta</a>
    <a href="#kallor" data-v="kallor">Källor</a>
    <a href="#import" data-v="import">Läs in &amp; spara</a>
  </nav>
  <div class="hdr-right">
    <div class="viewsel"><button class="viewbtn" id="viewBtn" title="Välj vad som ska synas"></button><div class="pop" id="viewPop"></div></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" placeholder="Sök person…" autocomplete="off">
      <div class="res" id="qres"></div>
    </div>
    <div class="status" id="status"><i></i><span>Ansluter…</span></div>
    <button class="sizebtn" id="sizeBtn" title="Större text" aria-label="Större text">A<span>A</span></button>
    <button class="themebtn" id="themeBtn" title="Växla mörkt/ljust läge" aria-label="Växla mörkt/ljust läge"></button>
  </div>
</header>
<div id="demoBar"><span>👑 Du tittar på exemplet <b>Vasaätten</b>. Inget sparas här – dina egna uppgifter ligger orörda.</span><span style="flex:1"></span><button class="btn primary" id="demoExitBtn" onclick="exitDemo()">Stäng exemplet</button></div>
<main>
  <section id="view"></section>
  <aside id="panel"></aside>
</main>

<script src="src/app.js"></script>
</body>
</html>
